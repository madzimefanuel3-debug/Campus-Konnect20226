<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="100%" height="100%">
    <defs>
        <filter id="neon-cyan" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
        <filter id="neon-magenta" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
        <linearGradient id="cyber-grad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#00f3ff" />
            <stop offset="100%" stop-color="#ff00e5" />
        </linearGradient>
    </defs>
    <!-- Geometric Network Icon scaled up and centered -->
    <g transform="translate(15, 10)">
        <polyline points="0,20 15,5 30,20 20,40 5,40 0,20" fill="none" stroke="#00f3ff" stroke-width="2" filter="url(#neon-cyan)" />
        <line x1="15" y1="5" x2="20" y2="25" stroke="#ff00e5" stroke-width="2" filter="url(#neon-magenta)" />
        <line x1="20" y1="25" x2="30" y2="20" stroke="#00f3ff" stroke-width="2" />
        <line x1="20" y1="25" x2="5" y2="40" stroke="#ff00e5" stroke-width="2" />
        <circle cx="15" cy="5" r="3" fill="#00f3ff" />
        <circle cx="30" cy="20" r="3" fill="#ff00e5" />
        <circle cx="20" cy="40" r="3" fill="#00f3ff" />
        <circle cx="5" cy="40" r="3" fill="#ff00e5" />
        <circle cx="0" cy="20" r="3" fill="#00f3ff" />
        <circle cx="20" cy="25" r="2.5" fill="#fff" />
    </g>
</svg>
